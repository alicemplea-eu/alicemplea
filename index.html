<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alicemplea | بوابة العمل والسكن والخدمات في إسبانيا وفرنسا</title>
  <link href="https://googleapis.com" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
    body { background: #E9E5DC; color: #1F2933; }
    .app-shell {
      max-width: 480px; margin: 0 auto; min-height: 100vh;
      background: #F5F3EE; position: relative; padding-bottom: 85px;
      box-shadow: 0 0 30px rgba(0,0,0,0.08);
    }
    .alert-bar {
      background: #F2E2D8; color: #8C3B19; font-size: 11px; font-weight: 700;
      padding: 8px 12px; text-align: center; border-bottom: 1px solid #E5CEC0;
    }
    .header {
      background: rgba(245, 243, 238, 0.96); position: sticky; top: 0; z-index: 40;
      padding: 12px 16px 8px; border-bottom: 1px solid #E6E1D6;
    }
    .header-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
    .brand { display: flex; align-items: center; gap: 8px; }
    .logo-img {
      width: 44px; height: 44px; border-radius: 50%; object-fit: cover;
      border: 2px solid #133A32; background: #133A32;
    }
    .brand-name { font-size: 20px; font-weight: 900; color: #1A1A1A; }
    .lang-box {
      display: flex; align-items: center; gap: 4px; background: #FFF;
      padding: 4px; border-radius: 999px; border: 1px solid #E2DDD2;
    }
    .lang-btn {
      width: 28px; height: 28px; border-radius: 50%; border: none; background: transparent;
      font-size: 11px; font-weight: 800; color: #4B5563; cursor: pointer;
    }
    .lang-btn.active { background: #133A32; color: #FFF; }
    .all-langs-panel {
      display: none; background: #FFF; padding: 8px 12px; border-radius: 16px;
      border: 1px solid #DFD9CE; margin-bottom: 10px; align-items: center; justify-content: space-between;
    }
    .all-langs-panel.open { display: flex; }
    .btn-offer {
      width: 100%; background: #C85A28; color: #FFF; border: none;
      padding: 12px; border-radius: 999px; font-size: 16px; font-weight: 800;
      cursor: pointer; box-shadow: 0 4px 12px rgba(200,90,40,0.25);
    }
    .cats-scroll {
      display: flex; gap: 8px; overflow-x: auto; padding: 12px 0 4px;
      scrollbar-width: none;
    }
    .cats-scroll::-webkit-scrollbar { display: none; }
    .cat-pill {
      flex-shrink: 0; background: #FFF; border: 1px solid #DED9CE; color: #374151;
      padding: 6px 14px; border-radius: 999px; font-size: 12px; font-weight: 700;
      cursor: pointer; display: flex; align-items: center; gap: 5px;
    }
    .cat-pill.active { background: #133A32; color: #FFF; border-color: #133A32; }
    .main-area { padding: 16px; }
    .hero-banners { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
    .dest-card {
      position: relative; height: 110px; border-radius: 18px; overflow: hidden;
      cursor: pointer; border: 1px solid #DDD7CA;
    }
    .dest-card img { width: 100%; height: 100%; object-fit: cover; }
    .dest-overlay {
      position: absolute; inset: 0; background: linear-gradient(to top, rgba(19,58,50,0.9), rgba(0,0,0,0.15));
      display: flex; flex-direction: column; justify-content: flex-end; padding: 10px; color: #FFF;
    }
    .dest-title { font-size: 14px; font-weight: 900; }
    .dest-sub { font-size: 10px; color: #E6ECE8; }
    .sage-card {
      background: #E6ECE8; border: 1px solid #CFDAD3; border-radius: 24px;
      padding: 18px; margin-bottom: 16px;
    }
    .btn-forest {
      width: 100%; background: #133A32; color: #FFF; border: none; padding: 12px;
      border-radius: 999px; font-size: 14px; font-weight: 800; cursor: pointer; margin-top: 12px;
    }
    .ai-box {
      background: #FFF; border: 1px solid #E2DDD2; border-radius: 24px;
      padding: 14px; margin-bottom: 16px;
    }
    .ai-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
    .ai-item {
      background: #F5F3EE; border: 1px solid #E5DFD3; border-radius: 16px;
      padding: 10px 6px; text-align: center; cursor: pointer;
    }
    .filter-box {
      background: #EFECE6; border: 1px solid #E2DDD2; border-radius: 24px;
      padding: 14px; margin-bottom: 16px;
    }
    .search-input {
      width: 100%; background: #FFF; border: 1px solid #E2DDD2; border-radius: 999px;
      padding: 9px 14px; font-size: 13px; margin-bottom: 12px; outline: none;
    }
    .filter-label { font-size: 11px; font-weight: 700; color: #4B5563; margin-bottom: 6px; }
    .filter-row { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 10px; scrollbar-width: none; }
    .f-btn {
      flex-shrink: 0; background: #FFF; border: 1px solid #DED9CE; color: #374151;
      padding: 5px 14px; border-radius: 999px; font-size: 12px; font-weight: 700; cursor: pointer;
    }
    .f-btn.active { background: #133A32; color: #FFF; border-color: #133A32; }
    .offer-card {
      background: #FFF; border: 1px solid #E4DFD4; border-radius: 22px;
      padding: 16px; margin-bottom: 12px;
    }
    .offer-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .offer-price { font-size: 18px; font-weight: 900; color: #C85A28; text-align: left; }
    .tag {
      display: inline-block; background: #F5F3EE; border: 1px solid #E2DDD2;
      padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; margin-top: 8px; margin-left: 4px;
    }
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; max-width: 480px; margin: 0 auto;
      background: rgba(245, 243, 238, 0.97); border-top: 1px solid #E2DDD2;
      display: grid; grid-template-columns: repeat(5, 1fr); padding: 6px 4px; z-index: 40;
    }
    .nav-item {
      background: none; border: none; display: flex; flex-direction: column;
      align-items: center; gap: 2px; color: #6B7280; font-size: 11px; font-weight: 700; cursor: pointer;
    }
    .nav-item.active { color: #133A32; font-weight: 900; }
    .nav-circle {
      width: 34px; height: 34px; border-radius: 50%; display: flex;
      align-items: center; justify-content: center; font-size: 17px;
    }
    .nav-item.active .nav-circle { background: #133A32; color: #FFF; }
    .drawer-bg, .modal-bg {
      position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 50;
      display: none; max-width: 480px; margin: 0 auto;
    }
    .drawer-bg.open { display: flex; flex-direction: column; justify-content: flex-end; }
    .modal-bg.open { display: flex; align-items: center; justify-content: center; padding: 16px; }
    .drawer-sheet {
      background: #F5F3EE; border-radius: 28px 28px 0 0; max-height: 85vh;
      overflow-y: auto; padding: 20px; border-top: 1px solid #DFD9CE;
    }
    .modal-card {
      background: #F5F3EE; border-radius: 24px; width: 100%; max-height: 85vh;
      overflow-y: auto; padding: 20px; border: 1px solid #DFD9CE;
    }
    .menu-row {
      width: 100%; background: #FFF; border: 1px solid #E5DFD3; padding: 12px 16px;
      border-radius: 16px; font-size: 13px; font-weight: 800; color: #1F2933;
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; cursor: pointer;
    }
    .menu-row.forest { background: #133A32; color: #FFF; border-radius: 999px; }
    .form-field {
      width: 100%; background: #FFF; border: 1px solid #DED9CE; border-radius: 14px;
      padding: 10px 12px; font-size: 13px; margin-bottom: 10px; outline: none;
    }
    .goog-te-banner-frame.skiptranslate { display: none !important; }
    body { top: 0 !important; }
  </style>
</head>
<body>

<div class="app-shell">
  <!-- تنبيه النصب -->
  <div class="alert-bar">🛡️ تنبيه ضد النصب: لا تدفع أي مبلغ قبل معاينة السكن وتوقيع العقد.</div>

  <!-- الهيدر -->
  <header class="header">
    <div class="header-top">
      <div class="brand">
        <img src="image_2d49378c.jpg" onerror="this.src='image_a55bef46.jpg'" alt="Alicemplea" class="logo-img" />
        <span class="brand-name">Alicemplea 🇪🇸🇫🇷</span>
      </div>
      <div class="lang-box">
        <button class="lang-btn active" onclick="setLang('ar','rtl',this)">AR</button>
        <button class="lang-btn" onclick="setLang('es','ltr',this)">ES</button>
        <button class="lang-btn" onclick="setLang('fr','ltr',this)">FR</button>
        <button class="lang-btn" onclick="setLang('en','ltr',this)">EN</button>
        <button class="lang-btn" style="background:#EBE8E0" onclick="document.getElementById('allLangs').classList.toggle('open')">🌍</button>
      </div>
    </div>

    <div id="allLangs" class="all-langs-panel">
      <span style="font-size:11px;font-weight:800;color:#133A32">🌍 كل لغات العالم:</span>
      <div id="google_translate_element"></div>
    </div>

    <button class="btn-offer" onclick="openModal('publish')">+ لدي عرض</button>

    <div class="cats-scroll">
      <button class="cat-pill" onclick="renderView('jobs', this)">💼 عروض العمل</button>
      <button class="cat-pill active" onclick="renderView('seekers', this)">🔍 أبحث عن عمل / السيرة</button>
      <button class="cat-pill" onclick="renderView('housing', this)">🏠 سكن</button>
      <button class="cat-pill" onclick="renderView('parcels', this)">📦 توصيل الطرود</button>
      <button class="cat-pill" onclick="renderView('migrants', this)">⚖️ خدمات المهاجرين</button>
      <button class="cat-pill" onclick="renderView('gov', this)">🏛️ عروض SEPE & France Travail</button>
    </div>
  </header>

  <!-- المحتوى -->
  <main id="appMain" class="main-area"></main>

  <!-- شريط التنقل السفلي -->
  <nav class="bottom-nav">
    <button class="nav-item" data-tab="home" onclick="renderView('home')">
      <div class="nav-circle">🏠</div><span>الرئيسية</span>
    </button>
