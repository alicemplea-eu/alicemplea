<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alicemplea | بوابة العمل والسكن والخدمات في إسبانيا وفرنسا</title>
  <script src="https://tailwindcss.com"></script>
  <link href="https://googleapis.com" rel="stylesheet">
  <style>
    :root {
      --bg-cream: #F5F3EE;
      --bg-card: #FFFFFF;
      --bg-soft: #EBE8E0;
      --forest: #133A32;
      --terracotta: #C85A28;
      --sage: #E6ECE8;
    }
    body {
      font-family: 'Cairo', sans-serif;
      background-color: var(--bg-cream);
      color: #1F2933;
      padding-bottom: 85px;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .goog-te-banner-frame.skiptranslate { display: none !important; }
    body { top: 0px !important; }
    .goog-te-gadget { font-family: inherit !important; color: transparent !important; }
    .goog-te-gadget .goog-te-combo {
      background-color: #FFFFFF; color: #133A32; border: 1px solid #D1CEC5;
      border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 700; outline: none;
    }
  </style>
</head>
<body class="max-w-md mx-auto min-h-screen shadow-2xl bg-[#F5F3EE] relative border-x border-[#E5E0D5]">

  <!-- تنبيه ضد النصب العلوي -->
  <div class="bg-[#F2E2D8] text-[#8C3B19] text-xs font-bold px-3 py-2 text-center flex items-center justify-center gap-1.5 border-b border-[#E5CEC0]">
    <span>🛡️</span>
    <span>تنبيه ضد النصب: لا تدفع أي مبلغ قبل معاينة السكن وتوقيع العقد.</span>
  </div>

  <!-- الهيدر العلوي -->
  <header class="bg-[#F5F3EE]/95 backdrop-blur sticky top-0 z-40 px-4 pt-3 pb-2 border-b border-[#E6E1D6]">
    <div class="flex items-center justify-between gap-2 mb-3">
      <!-- الشعار والاسم -->
      <div class="flex items-center gap-2">
        <img src="image_2d49378c.jpg" onerror="this.src='https://placehold.co'" alt="Alicemplea" class="w-11 h-11 rounded-full object-cover border-2 border-[#133A32] shadow-sm" />
        <div class="flex items-center gap-1.5">
          <span class="text-xl font-black text-[#1A1A1A] tracking-tight">Alicemplea</span>
          <span class="text-base">🇪🇸🇫🇷</span>
        </div>
      </div>

      <!-- أزرار اللغات الدائرية السريعة -->
      <div class="flex items-center gap-1 bg-white p-1 rounded-full border border-[#E2DDD2] shadow-xs">
        <button onclick="setQuickLang('ar', 'rtl', this)" class="lang-pill w-7 h-7 rounded-full text-[11px] font-black bg-[#133A32] text-white transition">AR</button>
        <button onclick="setQuickLang('es', 'ltr', this)" class="lang-pill w-7 h-7 rounded-full text-[11px] font-bold text-slate-600 hover:bg-slate-100 transition">ES</button>
        <button onclick="setQuickLang('fr', 'ltr', this)" class="lang-pill w-7 h-7 rounded-full text-[11px] font-bold text-slate-600 hover:bg-slate-100 transition">FR</button>
        <button onclick="setQuickLang('en', 'ltr', this)" class="lang-pill w-7 h-7 rounded-full text-[11px] font-bold text-slate-600 hover:bg-slate-100 transition">EN</button>
        <button onclick="toggleAllLangs()" title="جميع لغات العالم" class="w-7 h-7 rounded-full text-xs font-bold bg-[#EBE8E0] text-[#133A32] flex items-center justify-center">🌍</button>
      </div>
    </div>

    <!-- قائمة جميع لغات العالم (تظهر عند الضغط على 🌍) -->
    <div id="allLangsBox" class="hidden mb-2 bg-white p-2 rounded-2xl border border-[#DFD9CE] flex items-center justify-between">
      <span class="text-xs font-bold text-[#133A32]">اختر أي لغة في العالم:</span>
      <div id="google_translate_element"></div>
    </div>

    <!-- زر + لدي عرض الرئيسي -->
    <button onclick="openPublishModal()" class="w-full bg-[#C85A28] hover:bg-[#B24D1F] active:scale-[0.99] text-white font-extrabold py-3 rounded-full shadow-md flex items-center justify-center gap-2 text-base transition">
      <span class="text-xl leading-none">+</span>
      <span data-t="haveOffer">لدي عرض</span>
    </button>

    <!-- شريط الأقسام الأفقي السريع -->
    <div class="flex items-center gap-2 overflow-x-auto no-scrollbar pt-3 pb-1">
      <button onclick="switchTab('jobs', this)" class="cat-chip shrink-0 bg-white border border-[#DED9CE] text-slate-700 px-3.5 py-1.5 rounded-full text-xs font-bold flex items-center gap-1.5">
        <span>💼</span><span data-t="jobOffers">عروض العمل</span>
      </button>
      <button onclick="switchTab('seekers', this)" class="cat-chip shrink-0 bg-[#133A32] text-white px-3.5 py-1.5 rounded-full text-xs font-bold flex items-center gap-1.5">
        <span>🔍</span><span data-t="seekers">أبحث عن عمل / السيرة</span>
      </button>
      <button onclick="switchTab('housing', this)" class="cat-chip shrink-0 bg-white border border-[#DED9CE] text-slate-700 px-3.5 py-1.5 rounded-full text-xs font-bold flex items-center gap-1.5">
        <span>🏠</span><span data-t="housing">سكن</span>
      </button>
      <button onclick="switchTab('parcels', this)" class="cat-chip shrink-0 bg-white border border-[#DED9CE] text-slate-700 px-3.5 py-1.5 rounded-full text-xs font-bold flex items-center gap-1.5">
        <span>📦</span><span>توصيل الطرود</span>
      </button>
      <button onclick="switchTab('migrants', this)" class="cat-chip shrink-0 bg-white border border-[#DED9CE] text-slate-700 px-3.5 py-1.5 rounded-full text-xs font-bold flex items-center gap-1.5">
        <span>⚖️</span><span>خدمات المهاجرين</span>
      </button>
      <button onclick="switchTab('football', this)" class="cat-chip shrink-0 bg-white border border-[#DED9CE] text-slate-700 px-3.5 py-1.5 rounded-full text-xs font-bold flex items-center gap-1.5">
        <span>⚽</span><span>الجدول والنتائج</span>
      </button>
    </div>
  </header>

  <!-- المحتوى الرئيسي الديناميكي -->
  <main id="mainContent" class="px-4 pt-4 space-y-5"></main>

  <!-- زر فيسبوك العائم -->
  <a href="https://facebook.com" target="_blank" rel="noopener" class="fixed bottom-20 left-4 z-30 w-11 h-11 bg-[#1877F2] text-white rounded-full shadow-lg flex items-center justify-center text-xl font-black hover:scale-105 transition">
    f
  </a>

  <!-- شريط التنقل السفلي الثابت (5 أيقونات) -->
  <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-[#F5F3EE]/95 backdrop-blur border-t border-[#E2DDD2] z-40 px-2 py-1.5">
    <div class="grid grid-cols-5 items-center text-center">
      <button onclick="switchTab('home')" class="nav-btn flex flex-col items-center justify-center py-1 text-slate-500" data-nav="home">
        <div class="nav-icon w-9 h-9 rounded-full flex items-center justify-center text-lg">🏠</div>
        <span class="text-[11px] font-bold mt-0.5" data-t="navHome">الرئيسية</span>
      </button>
      <button onclick="switchTab('jobs')" class="nav-btn flex flex-col items-center justify-center py-1 text-slate-500" data-nav="jobs">
        <div class="nav-icon w-9 h-9 rounded-full flex items-center justify-center text-lg">💼</div>
        <span class="text-[11px] font-bold mt-0.5" data-t="navJobs">الوظائف</span>
      </button>
      <button onclick="switchTab('housing')" class="nav-btn flex flex-col items-center justify-center py-1 text-slate-500" data-nav="housing">
        <div class="nav-icon w-9 h-9 rounded-full flex items-center justify-center text-lg">🔑</div>
        <span class="text-[11px] font-bold mt-0.5" data-t="navRent">الإيجار</span>
      </button>
      <button onclick="switchTab('seekers')" class="nav-btn flex flex-col items-center justify-center py-1 text-[#133A32]" data-nav="seekers">
        <div class="nav-icon w-9 h-9 rounded-full bg-[#133A32] text-white flex items-center justify-center text-lg">👥</div>
        <span class="text-[11px] font-extrabold mt-0.5" data-t="navSeekers">الباحثون عن عمل</span>
      </button>
      <button onclick="openMoreDrawer()" class="nav-btn flex flex-col items-center justify-center py-1 text-slate-500" data-nav="more">
        <div class="nav-icon w-9 h-9 rounded-full flex items-center justify-center text-lg">☰</div>
        <span class="text-[11px] font-bold mt-0.5" data-t="navMore">المزيد</span>
      </button>
    </div>
  </nav>

  <!-- قائمة "كل الأقسام" المنبثقة من الأسفل (كما في Whacka) -->
  <div id="moreDrawer" class="fixed inset-0 bg-black/50 z-50 hidden flex-col justify-end max-w-md mx-auto">
    <div class="bg-[#F5F3EE] rounded-t-3xl max-h-[88vh] overflow-y-auto p-5 shadow-2xl border-t border-[#DFD9CE]">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-xl font-black text-[#1A1A1A]">كل الأقسام</h2>
        <button onclick="closeMoreDrawer()" class="w-9 h-9 rounded-full bg-white border border-[#DED9CE] flex items-center justify-center font-bold text-slate-600">✕</button>
      </div>

      <div class="space-y-2.5 text-sm font-bold">
        <button onclick="closeMoreDrawer(); switchTab('seekers')" class="w-full bg-[#133A32] text-white px-4 py-3.5 rounded-full flex items-center justify-between">
          <span>أبحث عن عمل / السيرة</span>
          <span>👥</span>
        </button>
        <button onclick="closeMoreDrawer(); switchTab('housing')" class="w-full bg-transparent hover:bg-white px-4 py-3 rounded-2xl flex items-center justify-between text-slate-800">
          <span>أبحث عن سكن</span>
          <span>🔍</span>
        </button>
        <button onclick="closeMoreDrawer(); openAiAssistant()" class="w-full bg-[#E6ECE8] border border-[#C6D5CC] px-4 py-3 rounded-2xl flex items-center justify-between text-[#133A32]">
          <span>🤖 المساعد الذكي AI (مقابلات وإدارة)</span>
          <span class="bg-[#133A32] text-white text-[10px] px-2 py-0.5 rounded-full">جديد</span>
        </button>
        <button onclick="closeMoreDrawer(); openCvBuilder()" class="w-full hover:bg-white px-4 py-3 rounded-2xl flex items-center justify-between text-slate-800">
