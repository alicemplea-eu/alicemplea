<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alicemplea | بوابة العمل والسكن والخدمات في إسبانيا وفرنسا وأوروبا</title>
  <link href="https://googleapis.com" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
    body { background: #E6E1D6; color: #1F2933; }
    .app { max-width: 480px; margin: 0 auto; min-height: 100vh; background: #F5F3EE; padding-bottom: 90px; position: relative; box-shadow: 0 0 30px rgba(0,0,0,0.08); }
    .alert { background: #F2E2D8; color: #8C3B19; font-size: 11px; font-weight: 700; padding: 8px 12px; text-align: center; border-bottom: 1px solid #E5CEC0; }
    .top { background: rgba(245,243,238,0.97); padding: 12px 15px 10px; border-bottom: 1px solid #E5E0D5; position: sticky; top: 0; z-index: 35; }
    .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .logo { width: 46px; height: 46px; border-radius: 50%; object-fit: cover; border: 2px solid #133A32; }
    .langs { display: flex; gap: 4px; background: #FFF; padding: 4px; border-radius: 99px; border: 1px solid #DED9CE; }
    .l-btn { width: 29px; height: 29px; border-radius: 50%; border: none; background: none; font-size: 11px; font-weight: 800; cursor: pointer; color: #374151; }
    .l-btn.on { background: #133A32; color: #FFF; }
    .world-bar { display: none; margin-top: 8px; background: #FFF; padding: 6px 12px; border-radius: 16px; border: 1px solid #DED9CE; align-items: center; justify-content: space-between; }
    .world-bar.show { display: flex; }
    .btn-orange { width: 100%; background: #C85A28; color: #FFF; border: none; padding: 12px; border-radius: 99px; font-size: 16px; font-weight: 800; margin-top: 10px; cursor: pointer; box-shadow: 0 4px 12px rgba(200,90,40,0.25); }
    .chips { display: flex; gap: 8px; overflow-x: auto; padding-top: 10px; scrollbar-width: none; }
    .chips::-webkit-scrollbar { display: none; }
    .chip { flex-shrink: 0; background: #FFF; border: 1px solid #DED9CE; padding: 6px 14px; border-radius: 99px; font-size: 12px; font-weight: 700; cursor: pointer; color: #1F2933; }
    .chip.on { background: #133A32; color: #FFF; border-color: #133A32; }
    .hero-banner { position: relative; height: 210px; margin: 14px; border-radius: 24px; overflow: hidden; box-shadow: 0 8px 20px rgba(0,0,0,0.12); }
    .hero-banner img { width: 100%; height: 100%; object-fit: cover; transition: 0.4s; }
    .hero-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(19,58,50,0.95) 10%, rgba(19,58,50,0.35) 60%, rgba(0,0,0,0.2)); color: #FFF; padding: 16px; display: flex; flex-direction: column; justify-content: space-between; }
    .dest-tabs { display: flex; gap: 6px; }
    .d-tab { background: rgba(255,255,255,0.2); backdrop-filter: blur(6px); border: 1px solid rgba(255,255,255,0.4); color: #FFF; padding: 5px 12px; border-radius: 99px; font-size: 12px; font-weight: 800; cursor: pointer; }
    .d-tab.on { background: #C85A28; border-color: #C85A28; }
    .sec { padding: 0 15px 15px; }
    .box-sage { background: #E6ECE8; border: 1px solid #CFDAD3; border-radius: 22px; padding: 16px; margin-bottom: 14px; }
    .box-white { background: #FFF; border: 1px solid #E2DDD2; border-radius: 22px; padding: 15px; margin-bottom: 12px; }
    .box-beige { background: #EFECE6; border: 1px solid #E2DDD2; border-radius: 22px; padding: 14px; margin-bottom: 14px; }
    .btn-green { width: 100%; background: #133A32; color: #FFF; padding: 11px; border-radius: 99px; font-size: 14px; font-weight: 800; border: none; cursor: pointer; margin-top: 10px; display: block; text-align: center; text-decoration: none; }
    .ai-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; text-align: center; }
    .ai-btn { background: #F5F3EE; border: 1px solid #E5DFD3; border-radius: 14px; padding: 10px 4px; font-size: 11px; font-weight: 800; color: #133A32; cursor: pointer; }
    .tag { display: inline-block; background: #F5F3EE; border: 1px solid #E2DDD2; padding: 3px 10px; border-radius: 99px; font-size: 11px; font-weight: 700; margin-top: 8px; margin-left: 4px; }
    .b-nav { position: fixed; bottom: 0; left: 0; right: 0; max-width: 480px; margin: 0 auto; background: rgba(245,243,238,0.98); border-top: 1px solid #E2DDD2; display: grid; grid-template-columns: repeat(5, 1fr); padding: 6px 0; text-align: center; z-index: 35; }
    .b-item { background: none; border: none; color: #4B5563; font-size: 11px; font-weight: 700; cursor: pointer; }
    .b-item.on { color: #133A32; font-weight: 900; }
    .b-icon { width: 32px; height: 32px; margin: 0 auto 2px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; }
    .b-item.on .b-icon { background: #133A32; color: #FFF; }
    .overlay-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 50; display: none; max-width: 480px; margin: 0 auto; }
    .overlay-bg.open { display: flex; flex-direction: column; justify-content: flex-end; }
    .sheet { background: #F5F3EE; border-radius: 28px 28px 0 0; max-height: 86vh; overflow-y: auto; padding: 20px; border-top: 1px solid #DFD9CE; }
    .m-row { width: 100%; background: #FFF; border: 1px solid #E5DFD3; padding: 12px 15px; border-radius: 16px; font-size: 13px; font-weight: 800; color: #1F2933; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; cursor: pointer; }
    .inp { width: 100%; background: #FFF; border: 1px solid #DED9CE; border-radius: 14px; padding: 10px 12px; font-size: 13px; margin-bottom: 10px; outline: none; }
    .goog-te-banner-frame.skiptranslate { display: none !important; }
    body { top: 0 !important; }
  </style>
</head>
<body>
<div class="app">
  <div id="t_alert" class="alert">🛡️ تنبيه ضد النصب: لا تدفع أي مبلغ قبل معاينة السكن وتوقيع العقد.</div>

  <div class="top">
    <div class="row">
      <div style="display:flex;align-items:center;gap:8px">
        <img src="image_a55bef46.jpg" class="logo" alt="Alicemplea Logo" />
        <strong style="font-size:20px">Alicemplea 🇪🇸🇫🇷</strong>
      </div>
      <div class="langs">
        <button class="l-btn on" onclick="chLang('ar',this)">AR</button>
        <button class="l-btn" onclick="chLang('es',this)">ES</button>
        <button class="l-btn" onclick="chLang('fr',this)">FR</button>
        <button class="l-btn" onclick="chLang('en',this)">EN</button>
        <button class="l-btn" style="background:#EBE8E0" onclick="document.getElementById('wBar').classList.toggle('show')">🌍</button>
      </div>
    </div>

    <div id="wBar" class="world-bar">
      <span style="font-size:11px;font-weight:800;color:#133A32">🌍 اختر أي لغة في العالم:</span>
      <div id="google_translate_element"></div>
    </div>

    <button id="t_offer" class="btn-orange" onclick="openSheet('publish')">+ لدي عرض</button>

    <div class="chips">
      <button id="t_c1" class="chip" onclick="showTab('jobs',this)">💼 عروض العمل</button>
      <button id="t_c2" class="chip on" onclick="showTab('seekers',this)">🔍 أبحث عن عمل / السيرة</button>
      <button id="t_c3" class="chip" onclick="showTab('housing',this)">🏠 سكن</button>
      <button class="chip" onclick="showTab('gov',this)">🏛️ SEPE & France Travail</button>
      <button id="t_c4" class="chip" onclick="showTab('services',this)">⚖️ الخدمات والباقات</button>
    </div>
  </div>

  <!-- الخلفية البانورامية المتغيرة ديناميكياً (أوروبا / إسبانيا / فرنسا) -->
  <div class="hero-banner">
    <img id="heroImg" src="image_14b87c6a.jpg" alt="Europe Banner" />
    <div class="hero-overlay">
      <div class="dest-tabs">
        <button class="d-tab on" onclick="setDest('EU',this)">🇪🇺 أوروبا</button>
        <button class="d-tab" onclick="setDest('ES',this)">🇪🇸 إسبانيا</button>
        <button class="d-tab" onclick="setDest('FR',this)">🇫🇷 فرنسا</button>
      </div>
      <div>
        <span id="heroBadge" style="font-size:11px;color:#FCD34D;font-weight:800">🇪🇺 الاتحاد الأوروبي الشامل</span>
        <h2 id="heroTitle" style="font-size:17px;font-weight:900;margin-top:2px">العمل والسكن والخدمات في إسبانيا وفرنسا</h2>
      </div>
    </div>
  </div>

  <main id="mainBody" class="sec"></main>
  <!-- شريط التنقل السفلي الثابت (5 أيقونات) -->
  <nav class="b-nav">
    <button id="t_n1" class="b-item" data-v="home" onclick="showTab('home')"><div class="b-icon">🏠</div>الرئيسية</button>
    <button id="t_n2" class="b-item" data-v="jobs" onclick="showTab('jobs')"><div class="b-icon">💼</div>الوظائف</button>
    <button id="t_n3" class="b-item" data-v="housing" onclick="showTab('housing')"><div class="b-icon">🔑</div>الإيجار</button>
    <button id="t_n4" class="b-item on" data-v="seekers" onclick="showTab('seekers')"><div class="b-icon">👥</div>الباحثون</button>
    <button id="t_n5" class="b-item" data-v="more" onclick="document.getElementById('moreBox').classList.add('open')"><div class="b-icon">☰</div>المزيد</button>
  </nav>

  <!-- قائمة كل الأقسام المنبثقة (المزيد) -->
  <div id="moreBox" class="overlay-bg" onclick="if(event.target===this)this.classList.remove('open')">
    <div class="sheet">
      <div class="row" style="margin-bottom:14px">
        <strong style="font-size:18px">كل الأقسام</strong>
        <button onclick="document.getElementById('moreBox').classList.remove('open')" style="width:32px;height:32px;border-radius:50%;border:1px solid #DED9CE;background:#FFF;font-weight:900">✕</button>
      </div>
      <button class="m-row" style="background:#133A32;color:#FFF" onclick="closeMore();showTab('seekers')"><span>أبحث عن عمل / السيرة</span><span>👥</span></button>
      <button class="m-row" onclick="closeMore();showTab('housing')"><span>أبحث عن سكن</span><span>🏠</span></button>
      <button class="m-row" style="background:#E6ECE8" onclick="closeMore();openSheet('ai')"><span>🤖 المساعد الذكي AI (مقابلات وإدارة)</span><span>جديد</span></button>
      <button class="m-row" onclick="closeMore();openSheet('cv')"><span>✨ منشئ السيرة الذاتية الأوروبية</span><span>5€ / 8€</span></button>
      <button class="m-row" onclick="closeMore();showTab('gov')"><span>🏛️ عروض رسمية (SEPE & France Travail)</span><span>✓</span></button>
      <button class="m-row" onclick="closeMore();showTab('services')"><span>⚖️ خدمات المهاجرين والمحامين</span><span>25€</span></button>
      <button class="m-row" style="color:#C85A28" onclick="closeMore();openSheet('promo')"><span>⭐ تمييز الإعلان (5 يورو) وباقة التجار (15€)</span><span>★</span></button>
      <button class="m-row" onclick="closeMore();openSheet('admin')"><span>🛡️ لوحة تحكم المالك</span><span>⚙️</span></button>
      <p style="text-align:center;font-size:11px;color:#6B7280;margin-top:12px">
        <a href="#" onclick="openSheet('legal');return false;" style="color:#133A32;font-weight:800">Aviso Legal & GDPR</a> • CHERIF CHEKLAL
      </p>
    </div>
  </div>

  <!-- نافذة النماذج التفاعلية -->
  <div id="sheetBox" class="overlay-bg" onclick="if(event.target===this)this.classList.remove('open')">
    <div class="sheet">
      <button onclick="document.getElementById('sheetBox').classList.remove('open')" style="width:32px;height:32px;border-radius:50%;border:1px solid #DED9CE;background:#FFF;font-weight:900;margin-bottom:8px">✕</button>
      <div id="sheetContent"></div>
    </div>
  </div>
</div>
<script>
  function googleTranslateElementInit() {
    new google.translate.TranslateElement({ pageLanguage: 'ar', autoDisplay: false }, 'google_translate_element');
  }

  let activeDest = 'EU';
  let activeTab = 'seekers';

  const destData = {
    EU: { img: 'image_14b87c6a.jpg', badge: '🇪🇺 الاتحاد الأوروبي الشامل', title: 'العمل والسكن والخدمات في إسبانيا وفرنسا' },
    ES: { img: 'image_2d49378c.jpg', badge: '🇪🇸 إسبانيا (أليكانتي، مدريد، برشلونة)', title: 'عروض العمل والسكن والخدمات في إسبانيا' },
    FR: { img: 'image_95a374c6.jpg', badge: '🇫🇷 فرنسا (باريس، ليون، مرسيليا)', title: 'عروض العمل والسكن والخدمات في فرنسا' }
  };

  const offersList = [
    { dest: 'ES', type: 'jobs', title: 'سائق شاحنة وتوزيع بضائع (رخصة C)', city: 'Alicante · أليكانتي', price: '1,650 €', per: 'شهرياً', tags: ['عقد دائم', 'مُحدّث ✓'] },
    { dest: 'FR', type: 'jobs', title: 'مساعد طباخ ونادل في مطعم بباريس', city: 'Paris · باريس', price: '1,800 €', per: 'شهرياً', tags: ['CDI', 'سكن متوفر'] },
    { dest: 'FR', type: 'housing', title: 'شقة مفروشة للكراء المؤقت واليومي في مارسيليا', city: 'Marseille · مرسيليا', price: '50 €', per: 'لليوم', tags: ['شقة كاملة', 'مفروش'] },
    { dest: 'ES', type: 'housing', title: 'غرفة مزدوجة مشمسة للإيجار في كاروليناس', city: 'Alicante · أليكانتي', price: '320 €', per: 'شهرياً', tags: ['شامل الفواتير', 'Empadronamiento'] }
  ];

  function setDest(d, btn) {
    activeDest = d;
    document.querySelectorAll('.d-tab').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    document.getElementById('heroImg').src = destData[d].img;
    document.getElementById('heroBadge').textContent = destData[d].badge;
    document.getElementById('heroTitle').textContent = destData[d].title;
    showTab(activeTab);
  }

  function closeMore() { document.getElementById('moreBox').classList.remove('open'); }

  function showTab(tab, chip) {
    activeTab = tab;
    if (chip) {
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('on'));
      chip.classList.add('on');
    }
    document.querySelectorAll('.b-item').forEach(n => n.classList.toggle('on', n.dataset.v === tab));
    const main = document.getElementById('mainBody');

    if (tab === 'seekers' || tab === 'home') {
      main.innerHTML = `
        <div class="box-sage">
          <span style="font-size:11px;font-weight:800;color:#133A32">✨ منشئ السيرة الذاتية الأوروبية</span>
          <h2 style="font-size:18px;font-weight:900;margin:4px 0">منشئ السيرة الذاتية بالإسبانية والفرنسية</h2>
          <p style="font-size:12px;color:#4B5563">اكتب بياناتك بأي لغة وسيصيغها التطبيق بصيغة Europass المهنية (5€ / 8€).</p>
          <button class="btn-green" onclick="openSheet('cv')">✨ أنشئ سيرتي الذاتية الآن</button>
        </div>
        <div class="box-white">
          <div class="row">
            <strong style="font-size:13px;color:#133A32">🤖 المساعد الذكي للعمل والاستقرار (AI)</strong>
            <span style="background:#E6ECE8;color:#133A32;font-size:10px;font-weight:800;padding:2px 8px;border-radius:99px">مباشر</span>
          </div>
          <div class="ai-3">
            <button class="ai-btn" onclick="openSheet('ai')">🎙️<br>محاكي المقابلات</button>
            <button class="ai-btn" onclick="openSheet('ai')">🏛️<br>المرشد الإداري</button>
            <button class="ai-btn" onclick="openSheet('ai')">🎯<br>معادل المهن</button>
          </div>
        </div>
        <div class="box-beige">
          <input class="inp" placeholder="🔍 بحث في العروض والملفات..." />
          <div style="font-size:11px;font-weight:800;color:#4B5563;margin-bottom:6px">الوضع القانوني</div>
          <div style="display:flex;gap:6px">
            <span class="chip on">الكل</span>
            <span class="chip">لديه NIE</span>
            <span class="chip">بدون NIE</span>
          </div>
        </div>
      `;
    } else if (tab === 'jobs' || tab === 'housing') {
      const list = offersList.filter(o => o.type === tab && (activeDest === 'EU' || o.dest === activeDest));
      main.innerHTML = `
        <div class="box-beige" style="text-align:center">
          <p style="font-size:12px;font-weight:700">لتمييز إعلانك في الأعلى مقابل <strong style="color:#C85A28">5 يورو</strong> راسل الإدارة:</p>
          <a href="mailto:alicemplea.eu@gmail.com" class="btn-green">✉️ التواصل عبر البريد (alicemplea.eu@gmail.com)</a>
        </div>
        ${list.map(i => `
          <div class="box-white">
            <div class="row">
              <div><strong style="font-size:15px">${i.title}</strong><p style="font-size:12px;color:#6B7280;margin-top:4px">📍 ${i.city}</p></div>
              <div style="text-align:left"><strong style="color:#C85A28;font-size:17px">${i.price}</strong><div style="font-size:10px;color:#6B7280">${i.per}</div></div>
            </div>
            <div>${i.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
          </div>
        `).join('')}
      `;
    } else if (tab === 'gov') {
      main.innerHTML = `
        <div class="box-white" style="border-color:#133A32">
          <span style="background:#133A32;color:#FFF;font-size:10px;padding:2px 8px;border-radius:99px">مصدر حكومي رسمي ✓</span>
          <h3 style="font-size:16px;font-weight:900;margin:8px 0">بوابات التوظيف الرسمية المعتمدة</h3>
          <a href="https://empleate.gob.es" target="_blank" class="btn-green">🇪🇸 بوابة SEPE / Empléate (إسبانيا) ↗</a>
          <a href="https://francetravail.fr" target="_blank" class="btn-green">🇫🇷 بوابة France Travail (فرنسا) ↗</a>
        </div>
      `;
    } else {
      main.innerHTML = `
        <div class="box-beige" style="text-align:center">
          <h3 style="font-size:16px;font-weight:900">⭐ الباقات والخدمات الموثقة</h3>
          <p style="font-size:12px;margin:8px 0;line-height:1.8">• تمييز إعلان: <strong>5€</strong><br>• باقة التجار (معلن موثق ✓): <strong>15€ / شهرياً</strong><br>• دليل المحامين المعتمدين: <strong>25€ / شهرياً</strong></p>
          <a href="mailto:alicemplea.eu@gmail.com" class="btn-green">✉️ التواصل مع الإدارة (alicemplea.eu@gmail.com)</a>
          <p style="font-size:10px;color:#6B7280;margin-top:10px">ALICEMPLEA © 2026 — CHERIF CHEKLAL | Aviso Legal & GDPR</p>
        </div>
      `;
    }
  }

  function openSheet(type) {
    const c = document.getElementById('sheetContent');
    if (type === 'publish') {
      c.innerHTML = `<h3 style="font-weight:900;margin-bottom:10px">+ نشر عرض أو ملف جديد</h3>
        <form onsubmit="event.preventDefault();alert('تم إرسال طلبك للإدارة alicemplea.eu@gmail.com');document.getElementById('sheetBox').classList.remove('open')">
          <select class="inp"><option>أبحث عن عمل (مجاني)</option><option>عرض عمل</option><option>عرض سكن</option></select>
          <input class="inp" required placeholder="عنوان العرض أو المهنة" />
          <input class="inp" required placeholder="المدينة (أليكانتي، باريس...)" />
          <textarea class="inp" rows="3" required placeholder="التفاصيل ورقم التواصل..."></textarea>
          <label style="font-size:11px;display:block;margin-bottom:10px"><input type="checkbox" required /> أوافق على سياسة الخصوصية GDPR</label>
          <button class="btn-orange" type="submit">نشر الآن</button>
        </form>`;
    } else if (type === 'cv') {
      c.innerHTML = `<h3 style="font-weight:900;margin-bottom:8px">✨ منشئ السيرة الذاتية الأوروبية</h3>
        <form onsubmit="event.preventDefault();window.location.href='mailto:alicemplea.eu@://gmail.com CV أوروبي';">
          <input class="inp" required placeholder="الاسم الكامل" />
          <input class="inp" required placeholder="المهنة والخبرات" />
          <select class="inp"><option>سيرة ذاتية CV فقط (5€)</option><option>CV + رسالة تحفيز (8€)</option></select>
          <button class="btn-green" type="submit">إرسال الطلب</button>
        </form>`;
    } else if (type === 'ai') {
      c.innerHTML = `<h3 style="font-weight:900;margin-bottom:8px">🤖 المساعد الذكي (Gemini AI)</h3>
        <p style="font-size:12px;color:#4B5563">جاهز للربط بمفتاح Gemini API المجاني الخاص بك لتشغيل محاكي المقابلات، المرشد الإداري، ومعادل المسميات المهنية.</p>`;
    } else if (type === 'admin') {
      c.innerHTML = `<h3 style="font-weight:900;margin-bottom:8px">🛡️ لوحة تحكم المالك (CHERIF CHEKLAL)</h3>
        <input type="password" class="inp" placeholder="كلمة مرور الإدارة..." />
